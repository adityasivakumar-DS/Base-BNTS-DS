document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

}\n  .rpt-nav-links::-webkit-scrollbar { display: none; }\n  .rpt-nav-links a { white-space: nowrap; }\n  .rpt-nav-date { display: none !important; }\n}\n\n@media (max-width: 860px) {\n  .rpt-grid-4 { grid-template-columns: repeat(2, 1fr) !important; }\n  .rpt-pillar-detail { grid-template-columns: 1fr !important; }\n}\n\n@media (max-width: 640px) {\n  .rpt-container { padding-left: 20px !important; padding-right: 20px !important; }\n  .rpt-nav-links { gap: 14px !important; }\n\n  .rpt-hero-grid { grid-template-columns: 1fr !important; gap: 28px !important; align-items: start !important; }\n  .rpt-hero-h1 { font-size: 36px !important; }\n  .rpt-hero-score { font-size: 64px !important; }\n  .rpt-hero-score-col { align-items: flex-start !important; }\n  .rpt-hero-counts { gap: 14px !important; }\n\n  .rpt-h2 { font-size: 28px !important; }\n  .rpt-section-head { align-items: flex-start !important; }\n\n  .rpt-grid-2, .rpt-grid-4 { grid-template-columns: 1fr !important; }\n\n  .rpt-bars-header { display: none !important; }\n  .rpt-bars-row {\n    grid-template-columns: auto 1fr auto !important;\n    grid-template-areas: \"num name status\" \"bar bar bar\" \"score score score\" !important;\n    row-gap: 8px !important;\n    column-gap: 10px !important;\n    padding: 16px 20px !important;\n  }\n  .rpt-row-num { grid-area: num !important; }\n  .rpt-row-name { grid-area: name !important; }\n  .rpt-row-status { grid-area: status !important; justify-self: start !important; }\n  .rpt-row-bar { grid-area: bar !important; }\n  .rpt-row-score { grid-area: score !important; text-align: left !important; }\n\n  .rpt-risk-row {\n    grid-template-columns: auto 1fr !important;\n    grid-template-areas: \"num sev\" \"body body\" \"action action\" !important;\n    gap: 12px !important;\n  }\n  .rpt-risk-num { grid-area: num !important; }\n  .rpt-risk-sev { grid-area: sev !important; justify-self: end !important; }\n  .rpt-risk-body { grid-area: body !important; }\n  .rpt-risk-action { grid-area: action !important; }\n\n  .rpt-pillar-score { font-size: 64px !important; }\n  .rpt-pillar-detail { padding: 28px !important; }\n\n  .rpt-decision-card { flex: 0 0 100% !important; }\n}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<nav style=\"position: fixed; top: 0; left: 0; right: 0; z-index: 50; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--color-gray-200);\">\n  <div class=\"rpt-nav-inner\" style=\"max-width: 1240px; margin: 0 auto; height: 64px; padding: 0 40px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 24px;\">\n    <div class=\"rpt-nav-logos\" style=\"justify-self: start; display: flex; align-items: center; gap: 16px; flex-shrink: 0;\">\n      <img src=\"de392011-67bc-421e-849a-7a70e4bdb67b\" alt=\"Bounteous\" style=\"height: 16px; display: block;\">\n      <span style=\"width: 1px; height: 24px; background: var(--color-gray-200); display: block;\"><\u002Fspan>\n      <x-import component-from-global-scope=\"image-slot\" id=\"client-logo\" shape=\"rounded\" radius=\"4\" fit=\"contain\" placeholder=\"Client logo\" style=\"width: 108px; height: 36px; display: block;\" hint-size=\"108px,36px\" data-comment-anchor=\"b9f7aaf666-image-slot\"><\u002Fx-import>\n    <\u002Fdiv>\n    <div class=\"rpt-nav-links\" style=\"justify-self: center; display: flex; align-items: center; gap: 32px; font-size: 14px; font-weight: 600;\">\n      <a href=\"#scorecard\" style=\"color: var(--color-midnight); text-decoration: none; transition: opacity 250ms;\" style-hover=\"opacity: 0.7;\">Scorecard<\u002Fa>\n      <a href=\"#risks\" style=\"color: var(--color-midnight); text-decoration: none; transition: opacity 250ms;\" style-hover=\"opacity: 0.7;\">Risks<\u002Fa>\n      <a href=\"#pillars\" style=\"color: var(--color-midnight); text-decoration: none; transition: opacity 250ms;\" style-hover=\"opacity: 0.7;\">Pillars<\u002Fa>\n      <a href=\"#decisions\" style=\"color: var(--color-midnight); text-decoration: none; transition: opacity 250ms;\" style-hover=\"opacity: 0.7;\">Decisions<\u002Fa>\n    <\u002Fdiv>\n    <span class=\"rpt-nav-date\" style=\"justify-self: end; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--color-gray-600); white-space: nowrap;\">Audit Report · {{ reportDate }}<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fnav>\n<div style=\"height: 64px;\"><\u002Fdiv>\n\n<section id=\"overview\" data-screen-label=\"Overview\" style=\"background: var(--color-midnight); color: #ffffff; position: relative; overflow: hidden;\">\n  <i style=\"position: absolute; left: 0; right: 0; top: 0; height: 4px; background: linear-gradient(135deg, #853eff 0%, #34b4ff 100%); display: block;\"><\u002Fi>\n  <i style=\"position: absolute; right: -240px; top: -240px; width: 720px; height: 720px; border-radius: 50%; background: radial-gradient(circle, rgba(105, 58, 244, 0.35) 0%, rgba(105, 58, 244, 0) 65%); display: block; pointer-events: none;\"><\u002Fi>\n  <div class=\"rpt-container rpt-hero-grid\" style=\"max-width: 1200px; margin: 0 auto; padding: 88px 64px 40px; display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 48px; align-items: end; position: relative;\">\n    <div style=\"display: flex; flex-direction: column; gap: 16px;\">\n      <span style=\"font-size: 13px; letter-spacing: 0.15em; text-transform: uppercase; font-weight: 400; color: var(--color-gray-400);\">Salesforce Platform Health Review · {{ reportDate }}<\u002Fspan>\n      <h1 class=\"rpt-hero-h1\" style=\"font-size: 52px; font-weight: 200; line-height: 1.1; color: #ffffff;\"><b style=\"font-weight: 700;\">{{ client }}<\u002Fb><\u002Fh1>\n      <p style=\"font-size: 17px; line-height: 1.6; color: var(--color-gray-400); max-width: 540px;\">{{ verdict }}<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"rpt-hero-score-col\" style=\"display: flex; flex-direction: column; align-items: flex-end; gap: 14px;\">\n      <div style=\"display: flex; align-items: baseline; gap: 12px;\">\n        <span class=\"rpt-hero-score\" style=\"font-size: 104px; font-weight: 700; line-height: 1; background: linear-gradient(135deg, #853eff 0%, #34b4ff 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;\">{{ overall }}<\u002Fspan>\n        <span style=\"font-size: 18px; color: var(--color-gray-600);\">\u002F 100<\u002Fspan>\n      <\u002Fdiv>\n      <span style=\"display: inline-flex; align-items: center; gap: 10px; border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 4px; padding: 7px 14px; font-size: 14px; font-weight: 600; color: #ffffff;\"><i style=\"width: 8px; height: 8px; border-radius: 50%; background: {{ overallColor }};\"><\u002Fi>{{ overallStatus }} overall health<\u002Fspan>\n      <div class=\"rpt-hero-counts\" style=\"display: flex; align-items: center; gap: 20px; font-size: 14px; color: var(--color-gray-400); flex-wrap: wrap;\">\n        <span style=\"display: inline-flex; align-items: center; gap: 8px;\"><i style=\"width: 7px; height: 7px; border-radius: 50%; background: #D9122F;\"><\u002Fi>{{ nCritical }} critical<\u002Fspan>\n        <span style=\"display: inline-flex; align-items: center; gap: 8px;\"><i style=\"width: 7px; height: 7px; border-radius: 50%; background: #D97800;\"><\u002Fi>{{ nHigh }} high<\u002Fspan>\n        <span style=\"display: inline-flex; align-items: center; gap: 8px;\"><i style=\"width: 7px; height: 7px; border-radius: 50%; background: rgba(255, 255, 255, 0.45);\"><\u002Fi>{{ nMedium }} medium<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"rpt-container\" style=\"max-width: 1200px; margin: 0 auto; padding: 0 64px 32px; position: relative;\">\n    <p style=\"border-top: 1px solid rgba(255, 255, 255, 0.14); padding-top: 20px; font-size: 16px; line-height: 1.6; color: var(--color-gray-400); max-width: 760px;\">{{ heroTakeaway }}<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"scorecard\" data-screen-label=\"Scorecard\" style=\"background: var(--color-gray-50); scroll-margin-top: 72px;\">\n  <div class=\"rpt-container\" style=\"max-width: 1200px; margin: 0 auto; padding: 64px 64px;\">\n    <div class=\"rpt-section-head\" style=\"display: flex; align-items: flex-end; justify-content: space-between; gap: 32px; margin-bottom: 28px; flex-wrap: wrap;\">\n      <div style=\"display: flex; flex-direction: column; gap: 10px; max-width: 640px;\">\n        <span style=\"font-size: 13px; letter-spacing: 0.15em; text-transform: uppercase; font-weight: 400; color: var(--color-gray-600);\">Scorecard<\u002Fspan>\n        <h2 class=\"rpt-h2\" style=\"font-size: 40px; font-weight: 200; line-height: 1.1; color: var(--color-midnight);\">One Score, <b style=\"font-weight: 700;\">Seven Pillars<\u002Fb><\u002Fh2>\n        <p style=\"font-size: 15px; line-height: 1.65; color: var(--color-gray-600);\">An overall {{ overall }} masks the spread across pillars. Select a pillar to see the evidence behind its score.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: flex; gap: 6px;\">\n        <button onclick=\"{{ setBars }}\" style=\"{{ vbStyle }}\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" strokewidth=\"2\" strokelinecap=\"round\" strokelinejoin=\"round\" style=\"width: 15px; height: 15px;\"><path d=\"M3 3v16a2 2 0 0 0 2 2h16\"><\u002Fpath><path d=\"M18 17V9\"><\u002Fpath><path d=\"M13 17V5\"><\u002Fpath><path d=\"M8 17v-3\"><\u002Fpath><\u002Fsvg>Bars<\u002Fbutton>\n        <button onclick=\"{{ setTiles }}\" style=\"{{ vtStyle }}\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" strokewidth=\"2\" strokelinecap=\"round\" strokelinejoin=\"round\" style=\"width: 15px; height: 15px;\"><rect width=\"7\" height=\"7\" x=\"3\" y=\"3\" rx=\"1\"><\u002Frect><rect width=\"7\" height=\"7\" x=\"14\" y=\"3\" rx=\"1\"><\u002Frect><rect width=\"7\" height=\"7\" x=\"14\" y=\"14\" rx=\"1\"><\u002Frect><rect width=\"7\" height=\"7\" x=\"3\" y=\"14\" rx=\"1\"><\u002Frect><\u002Fsvg>Tiles<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ vizBars }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"background: #ffffff; border: 1px solid var(--color-gray-200); border-radius: 24px; box-shadow: 0 8px 24px rgba(11, 17, 28, 0.06); overflow: hidden;\">\n        <div class=\"rpt-bars-header\" style=\"display: grid; grid-template-columns: 48px 250px 1fr 72px 110px; gap: 20px; align-items: center; padding: 18px 36px 12px; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; font-weight: 400; color: var(--color-gray-400);\">\n          <span><\u002Fspan><span>Pillar<\u002Fspan><span>Score on a shared 0–100 scale<\u002Fspan><span style=\"text-align: right;\">Score<\u002Fspan><span><\u002Fspan>\n        <\u002Fdiv>\n        <sc-for list=\"{{ pillars }}\" as=\"p\" hint-placeholder-count=\"7\">\n          <div class=\"rpt-bars-row\" onclick=\"{{ p.select }}\" style=\"display: grid; grid-template-columns: 48px 250px 1fr 72px 110px; gap: 20px; align-items: center; padding: 18px 36px; border-top: 1px solid var(--color-gray-100); cursor: pointer; transition: background 250ms;\" style-hover=\"background: var(--color-gray-50);\">\n            <span class=\"rpt-row-num\" style=\"font-size: 17px; font-weight: 200; color: var(--color-gray-400);\">{{ p.num }}<\u002Fspan>\n            <span class=\"rpt-row-name\" style=\"font-size: 15px; font-weight: 600; color: var(--color-midnight);\">{{ p.name }}<\u002Fspan>\n            <span class=\"rpt-row-bar\" style=\"position: relative; display: block; height: 10px; background: var(--color-gray-100); border-radius: 4px;\">\n              <i style=\"{{ p.fillStyle }}\"><\u002Fi>\n              <i style=\"position: absolute; left: 70%; top: -4px; bottom: -4px; width: 1px; background: var(--color-gray-400); display: block;\"><\u002Fi>\n            <\u002Fspan>\n            <span class=\"rpt-row-score\" style=\"text-align: right; font-size: 20px; font-weight: 700; color: {{ p.color }};\">{{ p.score }}<\u002Fspan>\n            <span class=\"rpt-row-status\" style=\"justify-self: end; font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; font-weight: 600; border: 1px solid {{ p.color }}; color: {{ p.color }}; border-radius: 4px; padding: 4px 12px;\">{{ p.status }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <p style=\"padding: 14px 36px 18px; border-top: 1px solid var(--color-gray-100); font-size: 11px; color: var(--color-gray-400);\">The vertical line marks 70 — the threshold for a healthy pillar.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ vizTiles }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"rpt-grid-4\" style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px;\">\n        <sc-for list=\"{{ pillars }}\" as=\"p\" hint-placeholder-count=\"7\">\n          <div onclick=\"{{ p.select }}\" style=\"background: #ffffff; border: 1px solid var(--color-gray-200); border-radius: 24px; box-shadow: 0 8px 24px rgba(11, 17, 28, 0.06); padding: 24px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; transition: opacity 250ms, transform 250ms;\" style-hover=\"opacity: 0.85; transform: translateY(-2px);\">\n            <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 8px;\">\n              <span style=\"font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; font-weight: 400; color: var(--color-gray-400);\">Pillar {{ p.num }}<\u002Fspan>\n              <span style=\"font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; font-weight: 600; border: 1px solid {{ p.color }}; color: {{ p.color }}; border-radius: 4px; padding: 3px 10px;\">{{ p.status }}<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"font-size: 44px; font-weight: 700; line-height: 1; color: {{ p.color }};\">{{ p.score }}<\u002Fspan>\n            <span style=\"font-size akeaway: 'Held back almost entirely by a 100% admin ratio \\u2014 both active users carry admin or View All access \\u2014 while 6 profiles and 20 permission sets carry zero assignments.',\n          metrics: [\n            { v: '2', l: 'Active users', d: 'A small, focused footprint with no inactive users holding licenses.', t: 'info' },\n            { v: '2 \u002F 2', l: 'Admin-level users', d: 'Every active user holds admin or View All access.', t: 'bad' },\n            { v: '6', l: 'Unassigned profiles', d: 'Custom profiles with no user assignments.', t: 'warn' },\n            { v: '20', l: 'Unassigned permission sets', d: 'Entitlement clutter that obscures who needs what.', t: 'warn' },\n          ],\n          actions: ['Right-size admin access to under 5%', 'Delete 6 unassigned profiles', 'Remove 20 unassigned permission sets', 'Consolidate access via permission sets'] },\n        { name: 'License & Cost', short: 'Licensing', score: 65, status: 'Fair', keyStat: '51 unused permission set licenses',\n          takeaway: '51 permission set licenses sit at 0% utilization and one package license is unused, against core license utilization of just 50%. This is recoverable contract spend, not a capability gap.',\n          metrics: [\n            { v: '50%', l: 'Core license utilization', d: 'Only 2 of 4 Salesforce licenses are in use.', t: 'warn' },\n            { v: '51', l: 'PSLs at 0% use', d: 'Permission set licenses provisioned but never used.', t: 'bad' },\n            { v: '1', l: 'Unused package license', d: 'Provisioned package capability with no meaningful usage.', t: 'warn' },\n            { v: '0 \u002F 201', l: 'Einstein requests used', d: 'Provisioned Einstein capacity with no consumption.', t: 'info' },\n          ],\n          actions: ['Deprovision 51 zero-use PSLs', 'Reclaim 1 unused package license', 'Right-size unused cloud features', 'Track optimization to renewal'] },\n        { name: 'Design & Architecture', short: 'Architecture', score: 100, status: 'Excellent', keyStat: '0 structural findings',\n          takeaway: 'The data model extracted cleanly with no structural findings. Architecture is not the constraint \\u2014 it is a stable foundation the access and license layers above it have not yet matched.',\n          metrics: [\n            { v: '0', l: 'Structural findings', d: 'No design or architecture risks raised in this assessment.', t: 'good' },\n            { v: '0', l: 'Custom objects flagged', d: 'Object footprint is well within healthy complexity thresholds.', t: 'good' },\n          ],\n          actions: ['Preserve current object-model strengths', 'Document integration dependencies', 'Maintain a design review cadence', 'Avoid unnecessary customization'] },\n        { name: 'Maintenance & Governance', short: 'Governance', score: 100, status: 'Excellent', keyStat: 'APIs current at v62\\u2013v66',\n          takeaway: 'API versions are current across components with no deprecated-version findings \\u2014 a codebase kept up to date rather than allowed to drift. A periodic review cadence will keep this pillar from decaying.',\n          metrics: [\n            { v: 'v62\\u2013v66', l: 'API version range', d: 'All components sit on current, supported API versions.', t: 'good' },\n            { v: '0', l: 'Components below v56', d: 'Nothing falls outside active compatibility guidance.', t: 'good' },\n            { v: '0', l: 'Stale sandboxes', d: 'No sandboxes flagged as overdue for refresh.', t: 'good' },\n          ],\n          actions: ['Maintain periodic API-version reviews', 'Activate standard duplicate rules', 'Keep a sandbox refresh cadence', 'Monitor configuration cleanliness'] },\n        { name: 'Security & Access Policy', short: 'Security', score: 45, status: 'Poor', keyStat: '100% of users hold admin access',\n          takeaway: 'The platform\\u2019s weakest dimension, with an unambiguous cause: every active user holds admin or elevated access, all vested in System Administrator. Unassigned entitlements widen the attack surface further.',\n          metrics: [\n            { v: '100%', l: 'Admin access ratio', d: 'Benchmark is under 5%. Every account is a full-org key.', t: 'bad' },\n            { v: '6', l: 'Unassigned profiles', d: 'Standing access nobody uses \\u2014 an avoidable attack surface.', t: 'warn' },\n            { v: '20', l: 'Unassigned permission sets', d: 'Permissions sprawl that should be removed.', t: 'warn' },\n          ],\n          actions: ['Move users to least-privilege permission sets', 'Reserve System Administrator for break-glass', 'Delete 6 unassigned profiles', 'Remove 20 unassigned permission sets', 'Enable login IP allowlisting for admin roles', 'Require MFA for all System Administrator sessions', 'Set up quarterly access-certification reviews'] },\n        { name: 'Code & Technical Quality', short: 'Code', score: 70, status: 'Good', keyStat: '1 failed Apex trigger',\n          takeaway: 'Code quality is solid but blocked by one acute issue \\u2014 OpportunityTrigger is in an invalid state, which can block deployments and break opportunity automation.',\n          metrics: [\n            { v: '1', l: 'Invalid Apex trigger', d: 'OpportunityTrigger is failed and blocks deployments.', t: 'bad' },\n            { v: '9', l: 'Apex classes', d: 'All classes sit on a current API version (v62).', t: 'info' },\n            { v: '0', l: 'Components below v56', d: 'The broader codebase is current and supportable.', t: 'good' },\n          ],\n          actions: ['Fix or disable the invalid OpportunityTrigger', 'Add a deployment-time validation gate', 'Maintain API-version currency', 'Add test coverage around triggers'] },\n        { name: 'Automation & Modernization', short: 'Automation', score: 85, status: 'Excellent', keyStat: 'No legacy workflow sprawl',\n          takeaway: 'The automation stack is modern and largely healthy; the same invalid trigger surfaces here because it sits in the execution path. The org has avoided legacy workflow sprawl, so the focus is narrow.',\n          metrics: [\n            { v: '1', l: 'Invalid trigger (high)', d: 'The lone automation defect, flagged to fix immediately.', t: 'bad' },\n            { v: '0', l: 'Legacy Process Builders', d: 'No retired Process Builder automations remain.', t: 'good' },\n            { v: '0', l: 'Legacy Workflow Rules', d: 'The org has avoided retired workflow-rule debt entirely.', t: 'good' },\n            { v: '1', l: 'Workflow field update left', d: 'The last legacy automation to migrate to Flow.', t: 'warn' },\n          ],\n          actions: ['Restore the invalid OpportunityTrigger', 'Migrate the last workflow field update to Flow', 'Maintain a flow-first approach', 'Add regression tests for opportunity automation'] },\n      ],\n      risks: [\n        { sev: 'Critical', pillar: 'Usage & Adoption', title: 'Admin Access Sprawl', evidence: '2 of 2 active users hold admin or View All access, so any compromised account can expose or corrupt the entire org.', action: 'Within 30 days, move both users to purpose-built permission sets; target an admin ratio under 5%.' },\n        { sev: 'Critical', pillar: 'Security & Access Policy', title: 'No Least-Privilege Model', evidence: 'With all control vested in System Administrator, the org cannot demonstrate access controls to auditors or contain a credential compromise.', action: 'Replace System Administrator assignments with scoped permission sets per job function.' },\n        { sev: 'High', pillar: 'License & Cost', title: '51 Idle Permission Set Licenses', evidence: '51 PSLs sit at 0% utilization, inflating contract cost with no operational return ahead of renewal.', action: 'Audit and deprovision the 51 zero-use PSLs this quarter; feed the count into renewal talks.' },\n        { sev: 'High', pillar: 'Code & Technical Quality', title: 'Failed OpportunityTrigger', evidence: 'The trigger is in an invalid state, which can block deployments and silently break opportunity automation.', action: 'Fix or disable the trigger immediately; add a deployment-time validation gate.' },\n        { sev: 'High', pillar: 'License & Cost', title: 'Core Licenses at 50% Utilization', evidence: 'Only 2 of 4 Salesforce licenses are in use, with one package license fully idle.', action: 'Right-size the license mix ahead of renewal and track utilization quarterly.' },\n      ],\n      decisions: [\n        { title: 'Approve Phase 1 Mobilization', body: 'Authorize admin least-privilege work, access cleanup, and the immediate fix of the failed OpportunityTrigger.' },\n        { title: 'Confirm License-Recovery Scope', body: 'Validate which of the 51 idle PSLs and the unused package license to deprovision ahead of renewal.' },\n        { title: 'Assign Access-Governance Ownership', body: 'Name an executive owner for least-privilege design, access reviews, and break-glass admin policy.' },\n        { title: 'Fund Phase 2 Planning', body: 'Prepare the governance-and-cleanup wave once access controls and the trigger fix are stable.' },\n      ],\n    };\n  }\n\n  tone(score) {\n    if (score >= 70) return 'good';\n    if (score >= 50) return 'warn';\n    return 'bad';\n  }\n\n  goPillar(i) {\n    this.setState({ tab: i });\n    const el = document.getElementById('pillars');\n    if (el) {\n      const y = el.getBoundingClientRect().top + window.scrollY - 64;\n      window.scrollTo({ top: y, behavior: 'smooth' });\n    }\n  }\n\n  scrollDecisions(dir) {\n    const el = document.getElementById('decisions-track');\n    if (el) el.scrollBy({ left: dir * el.clientWidth, behavior: 'smooth' });\n  }\n\n  toggleSevMode() {\n    this.setState({ sevMode: !this.state.sevMode, sevTab: 0, sevPillar: 0 });\n  }\n\n  setSevTab(i) {\n    this.setState({ sevTab: i, sevPillar: 0 });\n  }\n\n  setSevPillar(i) {\n    this.setState({ sevPillar: i });\n  }\n\n  openModal(title, items) {\n    this.setState({ modal: { title, items } });\n  }\n\n  closeModal() {\n    this.setState({ modal: null });\n  }\n\n  renderVals() {\n    const D = this.data();\n    \u002F\u002F Status colors carried over from the source audit template (Bounteous PPT palette companions)\n    const C = { good: '#159447', warn: '#D97800', bad: '#D9122F', info: '#33139f', muted: '#6b7280' };\n    const BG = { good: 'rgba(21, 148, 71, 0.1)', warn: 'rgba(217, 120, 0, 0.1)', bad: 'rgba(217, 18, 47, 0.1)', info: 'rgba(133, 62, 255, 0.12)' };\n    const viz = this.state.viz ?? (this.props.scorecardViz ?? 'bars');\n\n    const vizBtn = (on) => ({\n      display: 'inline-flex', alignItems: 'center', gap: 8,\n      padding: '8px 18px', borderRadius: 4, cursor: 'pointer',\n      fontSize: 13, fontWeight: 600, transition: 'all 250ms ease',\n      border: on ? '1px solid #33139f' : '1px solid #e2e4e9',\n      background: on ? '#33139f' : 'transparent',\n      color: on ? '#ffffff' : '#0b111c',\n    });\n\n    const PREVIEW_COUNT = 5;\n    const pillars = D.pillars.map((p, i) => {\n      const color = C[this.tone(p.score)];\n      const isActive = i === this.state.tab;\n      const allActions = p.actions || [];\n      const preview = allActions.slice(0, PREVIEW_COUNT);\n      const overflow = allActions.slice(PREVIEW_COUNT);\n      const leftCount = Math.ceil(preview.length \u002F 2);\n      return Object.assign({}, p, {\n        i, color,\n        num: String(i + 1).padStart(2, '0'),\n        dash: ((p.score \u002F 100) * 326.7).toFixed(1) + ' 326.7',\n        fillStyle: { position: 'absolute', left: 0, top: 0, bottom: 0, width: p.score + '%', background: color, borderRadius: 4, display: 'block' },\n        tabStyle: {\n          padding: '10px 20px', borderRadius: 4, cursor: 'pointer',\n          fontSize: 14, fontWeight: 600, transition: 'all 250ms ease',\n          border: isActive ? '1px solid #33139f' : '1px solid #e2e4e9',\n          background: isActive ? '#33139f' : '#ffffff',\n          color: isActive ? '#ffffff' : '#0b111c',\n        },\n        pick: () => this.setState({ tab: i }),\n        select: () => this.goPillar(i),\n        actionsLeft: preview.slice(0, leftCount),\n        actionsRight: preview.slice(leftCount),\n        hasMoreActions: overflow.length > 0,\n        showAllActions: () => this.openModal('Remaining Actions · ' + p.name, overflow),\n      });\n    });\n\n    const active = pillars[this.state.tab] || pillars[0];\n\n    const sevTabBtn = (on) => ({\n      padding: '10px 20px', borderRadius: 4, cursor: 'pointer',\n      fontSize: 14, fontWeight: 600, transition: 'all 250ms ease',\n      border: on ? '1px solid #33139f' : '1px solid #e2e4e9',\n      background: on ? '#33139f' : '#ffffff',\n      color: on ? '#ffffff' : '#0b111c',\n    });\n    const SEVERITIES = ['Critical', 'High', 'Medium', 'Low'];\n    const sevTabs = SEVERITIES.map((label, i) => {\n      const count = (D.risks || []).filter((r) => r.sev === label).length;\n      return {\n        label, i, count,\n        countLabel: String(count).padStart(2, '0'),\n        tabStyle: sevTabBtn(i === this.state.sevTab),\n        pick: () => this.setSevTab(i),\n      };\n    });\n    const activeSevTab = sevTabs[this.state.sevTab] || sevTabs[0];\n\n    const sevPillars = pillars.map((p, i) => {\n      const isNavActive = i === this.state.sevPillar;\n      const matches = (D.risks || []).filter((r) => r.pillar === p.name && r.sev === activeSevTab.label);\n      return {\n        i, name: p.name,\n        countLabel: String(matches.length).padStart(2, '0'),\n        navStyle: {\n          display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12,\n          width: '100%', textAlign: 'left', border: 'none',\n          padding: '12px 16px', borderRadius: 4, cursor: 'pointer',\n          fontSize: 14, fontWeight: isNavActive ? 700 : 600, transition: 'all 200ms ease',\n          borderLeft: isNavActive ? '3px solid #33139f' : '3px solid transparent',\n          background: isNavActive ? 'rgba(51, 19, 159, 0.06)' : 'transparent',\n          color: isNavActive ? '#33139f' : '#0b111c',\n        },\n        pickNav: () => this.setSevPillar(i),\n        hasMatches: matches.length > 0,\n        noMatches: matches.length === 0,\n        matchedRisks: matches.map((r, ri) => ({\n          num: String(ri + 1).padStart(2, '0'),\n          title: r.title,\n          evidence: r.evidence,\n          showActions: () => this.openModal('Recommended Actions · ' + p.name, p.actions || []),\n        })),\n      };\n    });\n    const activeSevPillar = sevPillars[this.state.sevPillar] || sevPillars[0];\n\n    return {\n      client: D.client,\n      reportDate: D.reportDate,\n      overall: D.overall,\n      overallStatus: D.overallStatus,\n      overallColor: C[this.tone(D.overall)],\n      nCritical: D.counts.critical,\n      nHigh: D.counts.high,\n      nMedium: D.counts.medium,\n      verdict: D.verdict,\n      heroTakeaway: D.heroTakeaway,\n      story: D.story.map((s) => Object.assign({}, s, {\n        color: C[s.tone],\n        bg: BG[s.tone],\n        isAlert: s.icon === 'alert',\n        isSparkle: s.icon !== 'alert',\n      })),\n      pillars,\n      active,\n      activeMetrics: (active.metrics || []).map((m) => Object.assign({}, m, { color: C[m.t] || C.info })),\n      activeActions: active.actions || [],\n      risks: D.risks.map((r, i) => Object.assign({}, r, {\n        num: String(i + 1).padStart(2, '0'),\n        color: r.sev === 'Critical' ? C.bad : (r.sev === 'High' ? C.warn : C.muted),\n      })),\n      decisions: D.decisions.map((d, i) => Object.assign({}, d, { num: String(i + 1).padStart(2, '0') })),\n      vizBars: viz === 'bars',\n      vizTiles: viz === 'tiles',\n      vbStyle: vizBtn(viz === 'bars'),\n      vtStyle: vizBtn(viz === 'tiles'),\n      setBars: () => this.setState({ viz: 'bars' }),\n      setTiles: () => this.setState({ viz: 'tiles' }),\n      decisionsPrev: () => this.scrollDecisions(-1),\n      decisionsNext: () => this.scrollDecisions(1),\n      sevMode: this.state.sevMode,\n      pillarMode: !this.state.sevMode,\n      toggleSevMode: () => this.toggleSevMode(),\n      sevSwitchTrackStyle: {\n        position: 'relative', display: 'inline-block', width: 44, height: 24,\n        borderRadius: 999, flexShrink: 0, transition: 'background 200ms ease',\n        background: this.state.sevMode ? '#33139f' : '#e2e4e9',\n      },\n      sevSwitchKnobStyle: {\n        position: 'absolute', top: 2, left: this.state.sevMode ? 22 : 2,\n        width: 20, height: 20, borderRadius: '50%', background: '#ffffff',\n        boxShadow: '0 1px 3px rgba(0, 0, 0, 0.25)', transition: 'left 200ms ease',\n      },\n      sevTabs,\n      activeSevTab,\n      sevPillars,\n      activeSevPillar,\n      modalOpen: !!this.state.modal,\n      modalTitle: this.state.modal ? this.state.modal.title : '',\n      modalItems: this.state.modal ? this.state.modal.items : [],\n      closeModal: () => this.closeModal(),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"</script>
